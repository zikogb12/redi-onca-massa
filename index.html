<style>
/* Layout : application de terrain installable (PWA), une colonne lisible au téléphone ; barre supérieure fixe, un module par écran, tableau de bord en grilles pour le superviseur. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE7; --ink:#1C2521; --muted:#5A6660; --line:#D5DCD4;
  --accent:#0D6C78; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0; --ochre:#A9681F;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --warn:#9A6512; --warn-soft:#F7EBD3; --bad:#AE3D2A; --bad-soft:#F6DFD9;
  --f-display:"Arial Narrow","Roboto Condensed",Arial,sans-serif; --f-body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --sunk:#202A26; --ink:#E3EAE6; --muted:#98A49E; --line:#2D3833;
  --accent:#4FB0BC; --accent-ink:#0B1A1C; --accent-soft:#16363A; --ochre:#D9A05B;
  --ok:#5DBB86; --ok-soft:#173826; --warn:#E0B04F; --warn-soft:#3A2E14; --bad:#E5806B; --bad-soft:#3E1F18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --sunk:#202A26; --ink:#E3EAE6; --muted:#98A49E; --line:#2D3833;
  --accent:#4FB0BC; --accent-ink:#0B1A1C; --accent-soft:#16363A; --ochre:#D9A05B;
  --ok:#5DBB86; --ok-soft:#173826; --warn:#E0B04F; --warn-soft:#3A2E14; --bad:#E5806B; --bad-soft:#3E1F18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:19px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.spacer{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 14px var(--f-body);cursor:pointer}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.net{font:500 11px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.net.on{background:var(--ok-soft);color:var(--ok)} .net.off{background:var(--warn-soft);color:var(--warn)}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:700} h3{font-size:16px;font-weight:700}
.eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font:600 15px var(--f-body);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font:600 12px var(--f-body);padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);background:var(--sunk)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.banner.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
/* formulaire */
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
.modnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.modnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--f-mono);border-radius:6px;padding:4px 8px;cursor:pointer}
.modnav button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.modnav button.err{border-color:var(--bad);color:var(--bad)}
.q{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q label.qt,.q .qt{font-weight:600}
.code{font:500 12px var(--f-mono);color:var(--accent);margin-right:6px}
.hint{font-size:13px;color:var(--muted)}
.err-msg{font-size:13px;color:var(--bad);font-weight:600}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.q.invalid input,.q.invalid select{border-color:var(--bad)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);cursor:pointer;min-height:44px;font-size:15px}
.chip input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip .k{font:500 12px var(--f-mono);color:var(--muted)}
.inline{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.inline label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.card+.card{margin-top:12px}
.card h3{display:flex;gap:8px;align-items:center}
.calc{font:500 13px var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 10px;color:var(--ink)}
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.footer-nav .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center}
.footer-nav .in .btn{flex:1}
/* tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.full{background:var(--ok)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 30px var(--f-display);font-stretch:85%}
.kpi span{font-size:13px;color:var(--muted)}
.list-item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.detail dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;margin:0}
.detail dt{color:var(--muted);font-size:13px}
.detail dd{margin:0;font-family:var(--f-mono);font-size:13px;word-break:break-word}
@media (max-width:520px){h1{font-size:24px}.detail dl{grid-template-columns:1fr}.detail dd{margin-bottom:6px}}
.gridq{display:grid;gap:8px}
.gridq label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;font-size:15px}
@media (max-width:520px){.gridq label{grid-template-columns:1fr;gap:4px}}
form.panel input{min-height:44px}
</style>
</head>

<script>

 {s:"805",n:"Belfaa",c:[21,13,4]},{s:"806",n:"Oukhrib",c:[26,15,10]},{s:"807",n:"Toussous",c:[25,12,6]},

const CULTURES=[["1","Tomate"],["2","Tomate cerise"],["3","Poivron"],["4","Haricot vert"],["5","Courgette"],["6","Concombre"],["7","Aubergine"],["8","Melon / pastèque"],["9","Pomme de terre"],["10","Oignon"],["11","Carotte"],["12","Fraise"],["13","Framboise"],["14","Myrtille"],["15","Banane"],["16","Agrumes"],["17","Olivier"],["18","Autre arboriculture"],["19","Maïs fourrager"],["20","Luzerne"],["21","Autre fourrage (bersim, orge…)"],["22","Céréales"],["23","Autre (préciser)"]];

const UNITE_DEF={lait:"l",viande:"t",ovcap:"t",vol:"o",ruch:"kg",autre:"kg"};

/* ============================ QUESTIONNAIRE (V6) ============================ */
// Types : one, multi, int, dec, text, tel, group, grid, rank, textarea, auto. rel(a) = filtre ; ex = codes exclusifs.
const has=(v,c)=>Array.isArray(v)&&v.includes(c);
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;
const classeOf=s=>{const x=num(s);return x==null?"":x<2?"1":x<=5?"2":"3"};
const CAMPAGNES=[["2425","2024-2025"],["2324","2023-2024"],["2223","2022-2023"],["avant","Avant 2022-2023"]];
const MODULES=[
{id:"m0",code:"0",title:"Identification et consentement",min:2,qs:[
 {id:"strate",code:"0.2",t:"one",l:"Territoire",o:TERRITOIRES},
 {id:"idExpl",code:"0.1",t:"auto",l:"Identifiant de l'exploitation",h:"Attribué automatiquement (territoire – enquêteur – numéro d'ordre)."},
 {id:"commune",code:"0.3a",t:"text",l:"Commune"},
 {id:"douar",code:"0.3b",t:"text",l:"Douar"},

 {id:"codeEnq",code:"0.5",t:"auto",l:"Code enquêteur"},

 {id:"motifRefus",code:"0.6b",t:"one",l:"Motif du refus",o:[["1","Manque de temps"],["2","Méfiance / crainte d'un contrôle"],["3","Pas intéressé"],["4","Autre"]],rel:a=>a.consent==="2"},
 {id:"motifRefusP",code:"0.6c",t:"text",l:"Préciser le motif",rel:a=>a.consent==="2"&&a.motifRefus==="4"},
 {id:"active",code:"0.7",t:"one",l:"L'exploitation a-t-elle été cultivée pendant la campagne 2025-2026 ?",o:YN,rel:a=>a.consent==="1"},
 {id:"derCamp",code:"0.7b",t:"one",l:"Dernière campagne au cours de laquelle l'exploitation a été cultivée",h:"Les modules C à E porteront sur cette campagne.",o:CAMPAGNES,rel:a=>a.consent==="1"&&a.active==="2"},
 {id:"supTot",code:"0.8",t:"dec",l:"Superficie totale de l'exploitation (exploitée et non exploitée, jachère comprise)",u:"ha",min:0,max:5000,rel:a=>a.consent==="1",h:"Information seulement : ne détermine pas la classe."},
 {id:"B1",code:"0.9",t:"dec",l:"Superficie agricole exploitée",u:"ha",min:0.01,max:5000,rel:a=>a.consent==="1",chk:a=>num(a.B1)>num(a.supTot)?"La superficie exploitée dépasse la superficie totale (0.8).":null}
]},
{id:"mA",code:"A",title:"Exploitant et ménage",min:4,qs:[
 {id:"A1",t:"one",l:"Le répondant est-il le chef d'exploitation ?",o:[["1","Oui"],["2","Non, gérant"],["3","Non, membre de la famille"]]},
 {id:"A1b",t:"text",l:"Nom et prénom du chef d'exploitation"},
 {id:"A1c",t:"text",l:"Nom et prénom du répondant",rel:a=>a.A1==="2"||a.A1==="3"},
 {id:"A1d",t:"text",l:"N° de CIN du chef d'exploitation (facultatif)",req:false},
 {id:"A2",t:"one",l:"Sexe du chef d'exploitation",o:[["1","Homme"],["2","Femme"]]},
 {id:"A3",t:"int",l:"Âge du chef d'exploitation",u:"ans",min:15,max:100},
 {id:"A4",t:"one",l:"Niveau d'instruction",o:[["0","Aucun"],["1","Coranique / alphabétisation"],["2","Primaire"],["3","Secondaire"],["4","Supérieur"]]},
 {id:"A5",t:"one",l:"L'agriculture est-elle votre activité principale ?",o:YN},
 {id:"A6",t:"group",l:"Membres du ménage travaillant sur l'exploitation",f:[["tot","Total",0,40],["fem","dont femmes",0,40],["jeu","dont jeunes < 40 ans",0,40]],chk:a=>{const g=a.A6||{};if(num(g.fem)>num(g.tot)||num(g.jeu)>num(g.tot))return"Les femmes et les jeunes ne peuvent pas dépasser le total.";}},

 {id:"A9",t:"one",l:"Lisez-vous les SMS sans aide ?",o:[["1","Oui"],["2","Avec aide"],["3","Non"]],rel:a=>a.A7==="1"||a.A7==="2"},
 {id:"A10",t:"grid",l:"Dans votre ménage, qui décide habituellement…",rows:[["cult","du choix des cultures"],["intr","de l'achat des intrants"],["vente","de la vente de la production"],["form","de la participation aux formations"]],o:[["1","Un homme du ménage"],["2","Une femme du ménage"],["3","Ensemble (homme et femme)"],["4","Autre personne (gérant, associé)"]]},
 {id:"A11",t:"one",l:"Un membre du ménage vit-il avec un handicap ou une maladie de longue durée qui limite son activité ?",o:[["1","Oui"],["2","Non"],["9","Ne souhaite pas répondre"]]}
]},
{id:"mB",code:"B",title:"Structure de l'exploitation",min:3,h:"La superficie exploitée (B1) est reprise de 0.9.",qs:[
 {id:"B2",t:"multi",l:"Mode de faire-valoir",o:[["1","Melk"],["2","Location"],["3","Association"],["4","Indivision"],["5","Autre"]]},
 {id:"B3",t:"dec",l:"Superficie irriguée",u:"ha",min:0,max:5000,chk:a=>num(a.B3)>num(a.B1)?"La superficie irriguée dépasse la superficie exploitée (0.9).":null},

 {id:"B6",t:"dec",l:"Superficie sous serre",u:"ha",min:0,max:5000,chk:a=>num(a.B6)>num(a.B1)?"La serre dépasse la superficie exploitée.":null},
 {id:"B7",t:"int",l:"Année d'installation du goutte-à-goutte",min:1980,max:2026,rel:a=>num(a.B4)>0},

 {id:"B9",t:"one",l:"Pratiquez-vous l'élevage (bétail, volailles, ruches) ?",o:YN}
]},

 {id:"C2",t:"one",l:"Source principale",o:a=>(a.C1||[]).map(c=>[c,MODULES[3].qs[0].o.find(x=>x[0]===c)[1]]),rel:a=>(a.C1||[]).length>1},

/* ============================ SERVEUR (Google Apps Script) ============================ */
async function api(action,p={},cred){
 if(!S.api)throw{code:"no_api"};
 const c=cred||S.user||{};
 const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),30000);
 let r;
 try{r=await fetch(S.api,{method:"POST",body:JSON.stringify(Object.assign({action,code:c.code,pin:c.pin},p)),signal:ctrl.signal,redirect:"follow"})}
 catch(e){throw{code:"reseau"}}finally{clearTimeout(t)}
 let j;try{j=await r.json()}catch(e){throw{code:"serveur"}}
 if(!j.ok)throw Object.assign({},j,{code:j.err||"serveur"});
 return j;
}
async function refresh(quiet){
 if(!S.user||!navigator.onLine||!S.api)return;
 S.loading=true;if(!quiet)render();
 try{
  const [qt,m]=await Promise.all([api("quotas"),api("mine")]);
  S.quota=qt.counts||{};S.quotaAt=Date.now();LS.set("redi_quota",S.quota);LS.set("redi_quotaAt",S.quotaAt);
  S.mine=m.items;S.mineAt=Date.now();LS.set("redi_mine",S.mine);LS.set("redi_mineAt",S.mineAt);
  if(isSup()){const s=await api("summary");S.all=s.items}
  S.note="";
 }catch(err){if(err.code==="auth"){logout(true);return}S.note=ERR[err.code]||"Actualisation impossible."}
 S.loading=false;render();
}
let syncing=false;
async function sync(){
 if(syncing||!S.user||!S.outbox.length||!navigator.onLine||!S.api)return;syncing=true;
 const queue=[...S.outbox];let sent=0;
 for(const s of queue){
  if(s._err)continue;
  try{const sub=Object.assign({},s);delete sub._err;const fl=flatten(sub);await api("submit",{sub,row:fl.main,cult:fl.cult,elv:fl.elv,intr:fl.intr,contact:fl.contact});S.outbox=S.outbox.filter(x=>x.id!==s.id);saveLocal();sent++}
  catch(e){
   if(e.code==="doublon"){const it=S.outbox.find(x=>x.id===s.id);if(it){it._err={code:e.code,par:e.par||"",statut:e.statut||"",par2:e.par2||""};saveLocal()}continue}
   S.note="Envoi interrompu : "+(ERR[e.code]||e.code)+" Les questionnaires restent sur ce téléphone.";break}
 }
 syncing=false;if(sent){toast(sent+" questionnaire(s) envoyé(s)");await refresh(true)}else render();
}
function logout(expired){S.user=null;LS.del("redi_user");S.mine=[];S.all=[];LS.del("redi_mine");if(expired)S.note="Votre code n'est plus accepté : reconnectez-vous.";S.view="home";render()}

function volume(a){
 if((a.C4c==="1"||a.C4c==="2")&&num(a.C4)!=null)return{v:num(a.C4),src:a.C4c==="1"?"compteur":"factures"};
 const c5=a.C5||{};if(a.C5c==="1"&&num(c5.debit)!=null&&num(c5.h)!=null&&num(c5.j)!=null)return{v:num(c5.debit)*num(c5.h)*num(c5.j),src:"débit × heures × jours"};
 if(a.C6!=null&&a.C6!=="NSP"&&num(a.C6)!=null)return{v:num(a.C6),src:"estimation exploitant"};
 if(a.C6==="NSP")return{v:null,src:"repère de secours (C6b) à estimer"};
 return{v:null,src:""};
}
// Charges : quantité × prix unitaire (coût calculé)
const E_QP=["E1","E4"],E_DH=["E5","E6","E7","E8","E9","E10"],L_QP=["L9","L12"];
const engCost=c=>c.E2==="1"?(c.E2l||[]).reduce((t,x)=>t+(num(x.q)||0)*(num(x.p)||0),0):0;
const phyCost=(c,y)=>c[y]==="1"?(c[PHY_LISTS[y][0]]||[]).reduce((t,m)=>t+(m.tr||[]).reduce((u,x)=>u+(num(x.q)||0)*(num(x.p)||0),0),0):0;
const qp=(o,k)=>(num(o[k+"q"])||0)*(num(o[k+"p"])||0);
// Fiche technico-économique d'une culture (par ha puis pour la superficie)
function cultCalc(c){
 const s=num(c.D3),q=num(c.D5),p=num(c.D7);
 const ciHa=E_QP.reduce((t,k)=>t+qp(c,k),0)+engCost(c)+phyCost(c,"E3m")+phyCost(c,"E3r")+E_DH.reduce((t,k)=>t+(num(c[k])||0),0),moHa=(num(c.E11)||0)*(num(c.E12)||0);
 const pbHa=q!=null&&p!=null&&s?q*p/s:null;
 return{rdt:q!=null&&s?q/s:null,pbHa,ciHa,moHa,vaHa:pbHa!=null?pbHa-ciHa:null,mbHa:pbHa!=null?pbHa-ciHa-moHa:null,jHa:(num(c.E11)||0)+(num(c.E13)||0),
  pb:pbHa!=null?pbHa*s:null,va:pbHa!=null?(pbHa-ciHa)*s:null,mo:s?moHa*s:0};
}
// Fiche technico-économique d'une activité d'élevage (montants de la campagne)
function elvCalc(e){
 const ventes=(num(e.L3)||0)*(num(e.L4)||0)+(num(e.L7)||0);
 const ci=qp(e,"L9")+(num(e.L10)||0)+(num(e.L11)||0)+(num(e.L13)||0),mo=qp(e,"L12");
 return{ventes,ci,mo,va:ventes-ci,mb:ventes-ci-mo};
}
function derive(f){
 const a=f.a,cs=f.cult||[],el=f.elv||{};
 let pb=0,va=0,mo=0,ok=true;
 cs.forEach(c=>{const k=cultCalc(c);if(k.va==null)ok=false;else{pb+=k.pb;va+=k.va;mo+=k.mo}});
 let vaE=0,moE=0;Object.keys(el).forEach(k=>{const x=elvCalc(el[k]);vaE+=x.va;moE+=x.mo});
 const vol=volume(a),vaT=ok?va+vaE:null;
 const b1=num(a.B1),b6=num(a.B6);
 const mode=b1&&b6!=null?(b6/b1>0.5?"sous serre":"plein champ"):"—";
 const k0=a.K0||{},cf=["loyer","assur","inter","entret","cotis","autre"].reduce((t,k)=>t+(num(k0[k])||0),0);
 const emb=cs.reduce((t,c)=>t+(num(c.D3)||0)*(num(c.D4)||1),0),b3=num(a.B3);
 return{vol:vol.v,volSrc:vol.src,valProd:ok?pb:null,va:vaT,marge:ok?vaT-mo-moE:null,prodEau:ok&&vol.v?vaT/vol.v:null,
  consoHa:vol.v&&num(a.B3)?vol.v/num(a.B3):null,mode,chargesFixes:cf,revenuNet:ok?vaT-mo-moE-cf:null,intens:b3&&cs.length?emb/b3*100:null,classe:classeOf(a.B1),
  nonExpl:num(a.supTot)&&b1!=null?(num(a.supTot)-b1)/num(a.supTot):null,
  F4:(has(a.C7,"3")||has(a.C7,"4"))?"1":"2",F8:a.C8==="1"?"1":"2",
  F12:(cs.some(c=>c.D8==="5")||a.H2==="1"||a.H4==="1"||a.H4==="2")?"1":"2"};
}
const cod=v=>typeof v==="string"&&/^\d{1,6}$/.test(v)?Number(v):(v??""); // codes de réponse en nombres
const PRIV=["A1b","A1c","A1d","K3"]; // noms et téléphone : onglet Contacts uniquement
// Tables à plat pour le classeur
function flatten(s){
 const d=derive(s);
 const r={id_questionnaire:s.id,id_exploitation:s.a.idExpl,strate:cod(s.a.strate),classe:cod(classeOf(s.a.B1)),statut:s.status,enqueteur:s.a.codeEnq||"",debut:new Date(s.startedAt).toISOString(),fin:new Date(s.endedAt).toISOString(),duree_min:s.durMin,version:s.formVersion};
 MODULES.forEach(m=>(m.qs||[]).forEach(q=>{const x=s.a[q.id];
  if(["idExpl","strate","codeEnq"].includes(q.id)||PRIV.includes(q.id)||q.t==="auto")return;
  if(q.t==="group")q.f.forEach(([k])=>r[`${q.id}_${k}`]=num((x||{})[k]));
  else if(q.t==="grid")q.rows.forEach(([k])=>r[`${q.id}_${k}`]=cod((x||{})[k]));
  else if(q.t==="multi"){r[q.id]=(x||[]).join(" ");const o=Array.isArray(q.o)?q.o:MODULES[3].qs[0].o;o.forEach(([c])=>r[`${q.id}_${c}`]=x?(x.includes(c)?1:0):null)}
  else if(q.t==="rank")for(let k=0;k<q.n;k++)r[`${q.id}_${k+1}`]=cod((x||[])[k]);
  else if(q.t==="int"||q.t==="dec")r[q.id]=x==="NSP"?9:num(x);
  else if(q.t==="one")r[q.id]=cod(x);
  else r[q.id]=x??""}));
 r.nb_cultures=(s.cult||[]).length;r.activites_elevage=Object.keys(s.elv||{}).join(" ");
 Object.assign(r,{calc_volume_m3:d.vol,calc_source_volume:d.volSrc,calc_valeur_production_cultures:d.valProd,calc_valeur_ajoutee:d.va,calc_marge_brute:d.marge,calc_productivite_eau_DH_m3:d.prodEau,calc_conso_m3_ha:d.consoHa,calc_charges_fixes_DH:d.chargesFixes,calc_revenu_agricole_net_DH:d.revenuNet,calc_taux_intensification_pct:d.intens,calc_mode_production:d.mode,calc_part_non_exploitee:d.nonExpl,F4:cod(d.F4),F8:cod(d.F8),F12:cod(d.F12)});
 const base=i=>({id_questionnaire:s.id,id_exploitation:s.a.idExpl,strate:cod(s.a.strate),classe:cod(classeOf(s.a.B1)),rang:i+1});
 const cult=(s.cult||[]).map((c,i)=>{const k=cultCalc(c),row=base(i);
  CULT_FIELDS.forEach(([f,,t])=>row[f]=t==="dec"||t==="int"?num(c[f]):t==="one"?(/^E\d+u$/.test(f)?(c[f]||""):cod(c[f])):(c[f]||""));
  E_QP.forEach(x=>row[`calc_${x}_DH_ha`]=num(c[x+"q"])!=null?qp(c,x):null);
  row.calc_E2_DH_ha=c.E2?engCost(c):null;row.calc_E3a_maladies_DH_ha=c.E3m?phyCost(c,"E3m"):null;row.calc_E3b_ravageurs_DH_ha=c.E3r?phyCost(c,"E3r"):null;
  row.nb_engrais=c.E2==="1"?(c.E2l||[]).length:0;row.nb_maladies=c.E3m==="1"?(c.E3ml||[]).length:0;row.nb_ravageurs=c.E3r==="1"?(c.E3rl||[]).length:0;
  Object.assign(row,{calc_rendement_t_ha:k.rdt,calc_produit_brut_DH_ha:k.pbHa,calc_conso_intermediaires_DH_ha:k.ciHa,calc_mo_salariee_DH_ha:k.moHa,calc_valeur_ajoutee_DH_ha:k.vaHa,calc_marge_brute_DH_ha:k.mbHa,calc_journees_ha:k.jHa});
  return row});
 const elv=Object.keys(s.elv||{}).map((k,i)=>{const e=s.elv[k],x=elvCalc(e),row=base(i);row.activite=k;row.activite_precision=e.Lp||"";
  ELV_FIELDS.forEach(([f,,t])=>row[f]=t==="dec"||t==="int"?num(e[f]):(e[f]||""));
  L_QP.forEach(y=>row[`calc_${y}_DH`]=num(e[y+"q"])!=null?qp(e,y):null);
  Object.assign(row,{calc_ventes_DH:x.ventes,calc_charges_hors_mo_DH:x.ci,calc_valeur_ajoutee_DH:x.va,calc_marge_brute_DH:x.mb});
  return row});
 const intr=[];(s.cult||[]).forEach((c,i)=>{const b0=Object.assign(base(i),{culture:cod(c.D1)});
  const put=(poste,cible,prod,x)=>intr.push(Object.assign({},b0,{poste,cible,produit:prod||"",unite:x.u||"",quantite_ha:num(x.q),prix_unitaire:num(x.p),cout_DH_ha:(num(x.q)||0)*(num(x.p)||0)}));
  if(c.E2==="1")(c.E2l||[]).forEach(x=>put("engrais","",x.t,x));
  Object.keys(PHY_LISTS).forEach(y=>{if(c[y]==="1")(c[PHY_LISTS[y][0]]||[]).forEach(m=>(m.tr||[]).forEach(x=>put(PHY_LISTS[y][3],m.m||"",x.n,x)))})});
 if(s.status!=="complet")intr.length=0;
 const contact={id_questionnaire:s.id,id_exploitation:s.a.idExpl,nom_chef:s.a.A1b||"",nom_repondant:s.a.A1c||"",cin:s.a.A1d||"",telephone:s.a.K3||"",commune:s.a.commune||"",douar:s.a.douar||""};
 return{main:r,cult,elv,intr,contact};
}
function dictRows(){
 const dict=[];MODULES.forEach(m=>(m.qs||[]).forEach(q=>{const o=Array.isArray(q.o)?q.o:null;
  if(q.t==="grid")q.rows.forEach(([k,l])=>q.o.forEach(([c,ll])=>dict.push({question:q.code||q.id,variable:`${q.id}_${k}`,libelle_question:q.l+" – "+l,code:c,libelle:ll})));
  else if(q.t==="group")q.f.forEach(([k,l])=>dict.push({question:q.code||q.id,variable:`${q.id}_${k}`,libelle_question:q.l+" – "+l,code:"",libelle:""}));
  else if(o)o.forEach(([c,l])=>dict.push({question:q.code||q.id,variable:q.id,libelle_question:q.l,code:c,libelle:l}));
  else dict.push({question:q.code||q.id,variable:q.id,libelle_question:q.l,code:"",libelle:q.u||""})}));
 CULT_FIELDS.concat(ELV_FIELDS).forEach(([k,l,t,o])=>{if(t==="one")o.forEach(([c,ll])=>dict.push({question:k,variable:k,libelle_question:l,code:c,libelle:ll}));else dict.push({question:k,variable:k,libelle_question:l,code:"",libelle:""})});
 UNITES_ENG.concat(UNITES_PHY.filter(x=>!UNITES_ENG.some(y=>y[0]===x[0]))).forEach(([c,l])=>dict.push({question:"E2 / E3",variable:"unite (onglet Intrants)",libelle_question:"Unité de l'engrais ou du traitement",code:c,libelle:l}));
 ACTIVITES.forEach(([c,l])=>dict.push({question:"L0",variable:"activite",libelle_question:"Activité d'élevage",code:c,libelle:l}));
 return dict;
}

/* ============================ STATUT, IDENTIFIANT ET QUOTAS ============================ */
const STATUT_LBL={complet:"complet",refus:"refus"};
function statusOf(a){return a.consent==="2"?"refus":"complet"}
// Identifiant : territoire – enquêteur – numéro d'ordre (unique sans réseau : chaque tablette numérote ses propres questionnaires)
function enqTag(){const c=String(S.user&&S.user.code||"X").toUpperCase().replace(/[^A-Z0-9]/g,"");const m=c.match(/(\d+)$/);return(c[0]||"E")+(m?m[1]:"")}
function nextSeq(){
 const tag="-"+enqTag()+"-";let mx=LS.get("redi_seq",0)||0;
 const ids=[...S.mine.map(m=>m.idExpl),...S.outbox.map(s=>s.a.idExpl),...Object.values(S.drafts).map(d=>d.a.idExpl)];
 ids.forEach(id=>{if(id&&id.includes(tag)){const n=parseInt(id.split(tag)[1],10);if(n>mx)mx=n}});
 LS.set("redi_seq",mx+1);return mx+1;
}
function assignId(f){if(!f.a.strate)return;if(!f.seq)f.seq=nextSeq();f.a.idExpl=`${f.a.strate}-${enqTag()}-${String(f.seq).padStart(3,"0")}`}
function quotaOf(strate,classe){const q=QUOTAS.find(x=>x.s===String(strate));return q&&classe?q.c[+classe-1]:null}
// Questionnaires complets par case (serveur, état du dernier « Actualiser », + envois en attente de cette tablette)
function quotaCounts(){const c=Object.assign({},S.quota||{});S.outbox.forEach(s=>{if(s.status==="complet"&&!s._err){const k=s.a.strate+"-"+classeOf(s.a.B1);c[k]=(c[k]||0)+1}});return c}
function quotaTable(c,compact){
 let h=`<div class="tablewrap"><table><thead><tr><th>Territoire</th>${["1","2","3"].map(k=>`<th class="num">${CLASSES[k]}</th>`).join("")}${compact?"":`<th class="num">Total</th>`}</tr></thead><tbody>`;
 QUOTAS.forEach(q=>{let tr=0,tq=0;h+=`<tr><td>${esc(q.s==="IP"?"Irrigation privée":q.s+" "+q.n)}</td>`+q.c.map((n,k)=>{const r=c[q.s+"-"+(k+1)]||0;tr+=r;tq+=n;return`<td class="num"><span class="${r>=n?"pill ok":r>=n*0.8?"pill warn":""}">${r} / ${n}</span></td>`}).join("")+(compact?"":`<td class="num"><b>${tr} / ${tq}</b></td>`)+`</tr>`});
 return h+`</tbody></table></div>`;
}

/* ============================ VISIBILITÉ ET CONTRÔLES ============================ */
function ctx(f){return Object.assign({},f.a,{_cult:f.cult||[]})}
function stopped(f){return statusOf(f.a)!=="complet"}
function modVisible(m,f){if(m.id!=="m0"&&stopped(f))return false;return m.rel?m.rel(ctx(f)):true}
function qVisible(q,f){return q.rel?!!q.rel(ctx(f)):true}
function opts(q,f){return typeof q.o==="function"?q.o(ctx(f)):q.o}
function emptyVal(v){return v==null||v===""||(Array.isArray(v)&&v.length===0)}
function checkQ(q,f){
 const a=f.a,v=a[q.id];if(!qVisible(q,f))return null;
 if(q.t==="auto")return q.id==="idExpl"&&!v?"Choisir d'abord le territoire (0.2).":null;
 const req=q.req!==false&&q.t!=="note";
 if(q.t==="group"){const g=v||{};if(req&&q.f.some(x=>x[4]!==false&&emptyVal(g[x[0]])))return"Compléter tous les champs (0 si aucun).";
   for(const x of q.f){const n=num(g[x[0]]);if(!emptyVal(g[x[0]])&&(n==null||n<x[2]||n>x[3]))return`${x[1]} : valeur entre ${x[2]} et ${x[3]}.`;if(!q.dec&&n!=null&&!Number.isInteger(n))return`${x[1]} : nombre entier attendu.`}}
 else if(q.t==="grid"){const g=v||{};if(req&&q.rows.some(([k])=>emptyVal(g[k])))return"Répondre pour chaque ligne."}
 else if(q.t==="rank"){const r=v||[];if(req&&!r[0])return"Indiquer au moins le premier sujet.";if(new Set(r.filter(Boolean)).size!==r.filter(Boolean).length)return"Choisir des sujets différents."}
 else{ if(req&&emptyVal(v))return"Réponse obligatoire.";
   if(!emptyVal(v)&&(q.t==="int"||q.t==="dec")&&v!=="NSP"){const n=num(v);if(n==null)return"Nombre attendu.";if(q.t==="int"&&!Number.isInteger(n))return"Nombre entier attendu.";if(q.min!=null&&n<q.min||q.max!=null&&n>q.max)return`Valeur entre ${q.min} et ${q.max}.`}
   if(q.t==="tel"&&!emptyVal(v)&&!/^[0-9 +]{9,15}$/.test(v))return"Numéro de téléphone non valide.";}
 if(q.chk){const m=q.chk(ctx(f));if(m)return m}
 return null;
}
function fieldErr(t,v,o1,o2){
 if(emptyVal(v))return"Obligatoire";
 if(t==="dec"||t==="int"){const n=num(v);if(n==null||n<o1||n>o2)return`Entre ${o1} et ${o2}`;if(t==="int"&&!Number.isInteger(n))return"Entier"}
 return null;
}
function checkCultures(f){
 const e={};const cs=f.cult||[];
 if(f.nCult==null)e._n="Indiquer le nombre de cultures principales.";
 cs.forEach((c,i)=>{CULT_FIELDS.forEach(([k,l,t,o1,o2])=>{
   if(k==="D1p"&&c.D1!=="23")return;
   if(/^E\d+[up]$/.test(k)&&!(num(c[k.slice(0,-1)+"q"])>0))return;
   const m=fieldErr(t,c[k],o1,o2);if(m)e[i+"."+k]=m});
  if(num(c.D6)>num(c.D5))e[i+".D6"]="Dépasse la production";
  const it=(x,k,pre)=>{["u","q","p"].forEach(z=>{const m=fieldErr(z==="u"?"one":"dec",x[z],0,z==="q"?1e7:1e6);if(m)e[pre+z]=m});if(z0(x.q))e[pre+"q"]="Quantité > 0"};
  if(c.E2==="1"){const L=c.E2l||[];if(!L.length)e[i+".E2l"]="Ajouter au moins un engrais (ou répondre Non).";
   L.forEach((x,k)=>{const pre=`${i}.E2l.${k}.`;if(emptyVal(x.t))e[pre+"t"]="Obligatoire";it(x,k,pre)})}
  Object.keys(PHY_LISTS).forEach(y=>{if(c[y]!=="1")return;const [lk,,lab,,g]=PHY_LISTS[y],L=c[lk]||[];
   if(!L.length)e[i+"."+lk]=`Ajouter au moins ${g.un} ${lab.toLowerCase()} (ou répondre Non).`;
   L.forEach((m,k)=>{const pm=`${i}.${lk}.${k}.`;if(emptyVal(m.m))e[pm+"m"]="Obligatoire";
    if(!(m.tr||[]).length)e[pm+"tr"]="Ajouter au moins un traitement";
    (m.tr||[]).forEach((x,j)=>{const pre=`${pm}${j}.`;if(emptyVal(x.n))e[pre+"n"]="Obligatoire";it(x,j,pre)})})});
 });
 const tot=cs.reduce((s,c)=>s+(num(c.D3)||0),0);
 if(num(f.a.B1)!=null&&tot>num(f.a.B1)*4.01)e._sup="La somme des superficies cultivées paraît trop élevée par rapport à la superficie exploitée (0.9).";
 return e;
}
const z0=v=>num(v)!=null&&num(v)<=0;
function checkElevage(f){
 const e={},el=f.elv||{},ks=Object.keys(el);
 if(!ks.length)e._elv="Cocher au moins une activité d'élevage (ou corriger B9).";
 ks.forEach(k=>{const x=el[k];
  if(k==="autre"&&emptyVal(x.Lp))e[k+".Lp"]="Obligatoire";
  ELV_FIELDS.forEach(([fk,l,t,o1,o2])=>{
   if((fk==="L4"||fk==="L5")&&!(num(x.L3)>0))return;
   if((fk==="L7"||fk==="L8")&&!(num(x.L6)>0))return;
   if(/^L\d+[up]$/.test(fk)&&!(num(x[fk.slice(0,-1)+"q"])>0))return;
   const m=fieldErr(t,x[fk],o1,o2);if(m)e[k+"."+fk]=m});
  if(num(x.L3)>num(x.L2)&&x.L2u!=="t")e[k+".L3"]="Dépasse la production";
 });
 return e;
}
function modErrors(i,f){
 const m=MODULES[i];if(!modVisible(m,f))return{};
 if(m.custom==="cultures")return checkCultures(f);
 const e=m.custom==="elevage"?checkElevage(f):{};
 (m.qs||[]).forEach(q=>{const r=checkQ(q,f);if(r)e[q.id]=r});return e;
}

/* ============================ RENDU : FORMULAIRE ============================ */
function visibleMods(f){return MODULES.map((m,i)=>i).filter(i=>modVisible(MODULES[i],f))}
function renderQ(q,f){
 const a=f.a,v=a[q.id],err=S.errors[q.id],code=q.code||q.id;
 let h=`<div class="q${err?" invalid":""}" data-q="${q.id}">`;
 const head=`<span class="code">${esc(code)}</span>${esc(q.l)}${q.u?` <span class="muted">(${esc(q.u)})</span>`:""}`;
 if(q.t==="auto"){
  h+=`<div class="qt">${head}</div><div class="calc mono">${esc(v||"— choisir d'abord le territoire")}</div>`;
 }else if(q.t==="one"||q.t==="multi"){
  h+=`<div class="qt" id="lb-${q.id}">${head}</div><div class="choices" role="${q.t==="one"?"radiogroup":"group"}" aria-labelledby="lb-${q.id}">`;

  h+=`</div>`;
 }else if(q.t==="grid"){
  h+=`<div class="qt">${head}</div><div class="gridq">`;
  q.rows.forEach(([k,l])=>{const cur=(v||{})[k]||"";h+=`<label><span>${esc(l)}</span><select id="${q.id}-${k}" data-k="${q.id}" data-grid="${k}"><option value="">—</option>${q.o.map(([c,ll])=>`<option value="${c}" ${cur===c?"selected":""}>${esc(c+" · "+ll)}</option>`).join("")}</select></label>`});
  h+=`</div>`;
 }else if(q.t==="group"){
  h+=`<div class="qt">${head}</div><div class="inline">`;
  q.f.forEach(([k,l])=>{h+=`<label>${esc(l)}<input type="number" inputmode="decimal" step="any" id="${q.id}-${k}" value="${esc((v||{})[k]??"")}" data-k="${q.id}" data-sub="${k}"></label>`});
  h+=`</div>`;

function renderDetail(s,sum){
 const d=derive(s),v=sum&&sum.validation;
 const rows=[];MODULES.forEach(m=>{(m.qs||[]).forEach(q=>{const x=s.a[q.id];if(emptyVal(x))return;rows.push([`${q.code||q.id} ${q.l}`,fmtAns(q,x)])})});
 const lab=(F,x,k)=>F.filter(z=>!emptyVal(x[z[0]])).map(z=>`<dt>${esc(z[0]+" "+z[1])}</dt><dd>${esc(z[2]==="one"?((z[3].find(o=>o[0]===x[z[0]])||[,x[z[0]]])[1]):x[z[0]])}</dd>`).join("");
 return`<div class="panel detail stack" id="detail"><div class="row"><h2 class="mono">${esc(s.a.idExpl)}</h2><span class="spacer"></span><button class="btn small ghost" data-act="closedetail">Fermer</button></div>
 <div class="grid"><div class="kpi"><b class="mono" style="font-size:20px">${d.vol!=null?fmt(d.vol)+" m³":"—"}</b><span>volume d'eau (${esc(d.volSrc||"—")})</span></div><div class="kpi"><b class="mono" style="font-size:20px">${d.va!=null?fmt(d.va)+" DH":"—"}</b><span>valeur ajoutée</span></div><div class="kpi"><b class="mono" style="font-size:20px">${d.prodEau!=null?fmt(d.prodEau,2)+" DH/m³":"—"}</b><span>productivité de l'eau</span></div><div class="kpi"><b style="font-size:16px">${esc(CLASSES[d.classe]||"—")} · ${esc(d.mode)}</b><span>classe · mode de production</span></div></div>
 <dl>${rows.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join("")}</dl>
 ${(s.cult||[]).map((c,i)=>{const k=cultCalc(c);return`<div class="card"><h3>Culture ${i+1} · ${esc((CULTURES.find(x=>x[0]===c.D1)||[,""])[1])}</h3><div class="calc">Rendement ${fmt(k.rdt,1)} t/ha · produit brut ${fmt(k.pbHa)} DH/ha · marge brute ${fmt(k.mbHa)} DH/ha</div><dl>${lab(CULT_FIELDS,c)}</dl>${intrList(c)}</div>`}).join("")}
 ${Object.keys(s.elv||{}).map(k=>{const e=s.elv[k],x=elvCalc(e);return`<div class="card"><h3>Élevage · ${esc((ACTIVITES.find(z=>z[0]===k)||[,k])[1])}${e.Lp?" ("+esc(e.Lp)+")":""}</h3><div class="calc">Ventes ${fmt(x.ventes)} DH · marge brute ${fmt(x.mb)} DH</div><dl>${lab(ELV_FIELDS,e)}</dl></div>`}).join("")}
 <div class="row"><input type="text" id="motif" placeholder="Motif en cas de rejet" style="flex:1;min-width:200px" value="${esc(v&&v.motif||"")}"><button class="btn primary" data-valid="approuve" data-id="${s.id}">Approuver</button><button class="btn danger" data-valid="rejete" data-id="${s.id}">Rejeter</button></div></div>`;
}
function fmtAns(q,x){
 if(q.t==="group")return q.f.map(([k,l])=>`${l} : ${x[k]??"—"}`).join(" · ");
 if(q.t==="grid")return q.rows.map(([k,l])=>`${l} : ${(q.o.find(o=>o[0]===x[k])||[,"—"])[1]}`).join(" · ");
 if(q.t==="rank")return(x||[]).filter(Boolean).map(c=>(q.o.find(o=>o[0]===c)||[,c])[1]).join(" > ");
 const o=Array.isArray(q.o)?q.o:null;
 if(q.t==="one"&&o)return(o.find(z=>z[0]===x)||[,x])[1];
 if(q.t==="multi"&&o)return x.map(c=>(o.find(z=>z[0]===c)||[,c])[1]).join(", ");
 return String(x);
}


function intrList(c){
 const li=(x,nom)=>`<li>${esc(nom||"—")} : ${esc(x.q||"?")} ${esc(x.u||"")}/ha × ${esc(x.p||"?")} DH = ${fmt((num(x.q)||0)*(num(x.p)||0))} DH/ha</li>`;
 let h="";
 if(c.E2==="1"&&(c.E2l||[]).length)h+=`<div class="eyebrow" style="margin-top:8px">Engrais (E2)</div><ul>${c.E2l.map(x=>li(x,x.t)).join("")}</ul>`;
 Object.keys(PHY_LISTS).forEach(y=>{const[lk,code,lab]=PHY_LISTS[y];if(c[y]==="1"&&(c[lk]||[]).length)h+=`<div class="eyebrow" style="margin-top:8px">${lab}s (${code})</div><ul>${c[lk].map(m=>`<li><b>${esc(m.m||"—")}</b><ul>${(m.tr||[]).map(x=>li(x,x.n)).join("")}</ul></li>`).join("")}</ul>`});
 return h;
}

const blankForm=()=>({id:uid(),a:{codeEnq:S.user?S.user.code:""},cult:[],nCult:null,elv:{},startedAt:Date.now(),updatedAt:Date.now()});
function newForm(pref){
 S.form=pref||blankForm();if(!S.form.elv)S.form.elv={};
 S.mod=0;S.errors={};S.view="form";render();window.scrollTo(0,0);
}
function persistDraft(){if(!S.form)return;S.form.updatedAt=Date.now();S.drafts[S.form.id]=S.form;saveLocal()}
function goto(i){S.mod=i;S.errors={};render();window.scrollTo(0,0)}
function step(dir){
 const f=S.form,vm=visibleMods(f),pos=vm.indexOf(S.mod);
 if(dir>0){const e=modErrors(S.mod,f);if(Object.keys(e).length){S.errors=e;render();const el=document.querySelector(".invalid,.err-msg");if(el)el.scrollIntoView({block:"center"});toast("Corriger les réponses signalées");return}}
 if(dir>0&&stopped(f)&&S.mod===0){finish();return}
 const nx=vm[pos+dir];if(nx!=null)goto(nx);
}
function finish(){
 const f=S.form,vm=visibleMods(f);
 for(const i of vm){const e=modErrors(i,f);if(Object.keys(e).length){S.mod=i;S.errors=e;render();toast("Module "+MODULES[i].code+" incomplet");return}}
 f.a.classe=classeOf(f.a.B1);
 const st=statusOf(f.a);
 const sub={id:f.id,a:f.a,cult:st==="complet"?f.cult:[],nCult:f.nCult,elv:st==="complet"&&f.a.B9==="1"?f.elv:{},seq:f.seq,startedAt:f.startedAt,endedAt:Date.now(),
  durMin:Math.round((Date.now()-f.startedAt)/60000),status:st,formVersion:FORM_VERSION};
 S.outbox=S.outbox.filter(x=>x.id!==sub.id);S.outbox.push(sub);delete S.drafts[f.id];saveLocal();
 S.form=null;S.view="home";toast(st==="complet"?"Questionnaire finalisé":"Refus enregistré");render();sync();
}
function gps(){
 if(!navigator.geolocation){toast("Position indisponible sur ce téléphone");return}
 toast("Recherche de la position…");
 navigator.geolocation.getCurrentPosition(p=>{if(!S.form)return;S.form.a.gps={lat:p.coords.latitude.toFixed(6),lon:p.coords.longitude.toFixed(6),acc:String(Math.round(p.coords.accuracy))};persistDraft();renderForm();toast("Position relevée (± "+Math.round(p.coords.accuracy)+" m)")},
  e=>toast(e.code===1?"Autorisez la localisation pour cette application":"Position introuvable : réessayez à l'extérieur"),{enableHighAccuracy:true,timeout:25000,maximumAge:60000});
}

  case"new":newForm();break;
  case"quit":persistDraft();S.form=null;S.view="home";render();break;
  case"next":step(1);break;case"prev":step(-1);break;case"finish":finish();break;
  case"sync":sync();break;
  case"refresh":refresh();break;
  case"gps":gps();break;
  case"closedetail":S.detail=null;S.detailSub=null;render();break;
  case"dict":b.disabled=true;try{await api("dict",{rows:dictRows()});toast("Dictionnaire écrit dans le classeur")}catch(e){toast(ERR[e.code]||"Écriture impossible")}b.disabled=false;break;
  case"logout":if(S.outbox.length){toast("Envoyez d'abord les questionnaires en attente");break}if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer la déconnexion";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="Se déconnecter"}},3000);break}logout();break;
 }
});
function rerenderKeepFocus(){const fid=document.activeElement&&document.activeElement.id;const y=window.scrollY;renderForm();window.scrollTo(0,y);if(fid){const n=document.getElementById(fid);if(n)n.focus({preventScroll:true})}}
document.addEventListener("change",ev=>{
 const el=ev.target,d=el.dataset;if(!S.form)return;const f=S.form,a=f.a;
 if(d.t==="one"){a[d.k]=el.value;if(d.k==="strate"){f.seq=f.seq||null;assignId(f)}}
 else if(d.t==="multi"){const q=findQ(d.k),cur=new Set(a[d.k]||[]);if(el.checked){if(q.ex&&q.ex.includes(el.value))cur.clear();else(q.ex||[]).forEach(x=>cur.delete(x));cur.add(el.value)}else cur.delete(el.value);a[d.k]=[...cur]}
 else if(d.grid!=null){a[d.k]=Object.assign({},a[d.k],{[d.grid]:el.value})}
 else if(d.rank!=null){a[d.k]=a[d.k]||[];a[d.k][+d.rank]=el.value}
 else if(d.nsp){a[d.nsp]=el.checked?"NSP":""}
 else if(d.ncult){const n=+el.value;f.nCult=n;f.cult=(f.cult||[]).slice(0,n);while(f.cult.length<n)f.cult.push({})}
 else if(d.elvsel){f.elv=f.elv||{};if(el.checked)f.elv[el.value]=f.elv[el.value]||{L2u:UNITE_DEF[el.value]};else delete f.elv[el.value]}
 else if(d.l&&el.tagName==="SELECT"){listTarget(f,d)[d.f]=el.value}
 else if(d.c!=null&&el.tagName==="SELECT"){const c=f.cult[+d.c];c[d.f]=el.value;
  if(d.f==="E2"&&el.value==="1"&&!(c.E2l||[]).length)c.E2l=[{}];
  if(PHY_LISTS[d.f]&&el.value==="1"&&!(c[PHY_LISTS[d.f][0]]||[]).length)c[PHY_LISTS[d.f][0]]=[{tr:[{}]}]}
 else if(d.e!=null&&el.tagName==="SELECT"){f.elv[d.e][d.f]=el.value}
 else if((el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&(d.k||d.sub||d.c!=null||d.e!=null)){persistDraft();if(sig()!==S._sig)setTimeout(rerenderKeepFocus,0);return}
 else return;
 persistDraft();const y=window.scrollY;renderForm();window.scrollTo(0,y);
});
document.addEventListener("input",ev=>{
 const el=ev.target,d=el.dataset;if(!S.form)return;const f=S.form,a=f.a;
 if(d.gps){const m=el.value.match(/(-?\d{1,2}\.\d+)[,\s/]+(-?\d{1,3}\.\d+)/);if(m){a.gps={lat:m[1],lon:m[2],acc:""};persistDraft();renderForm()}return}
 if(d.sub){a[d.k]=Object.assign({},a[d.k],{[d.sub]:el.value})}
 else if(d.l&&el.tagName==="INPUT"){listTarget(f,d)[d.f]=el.value}
 else if(d.c!=null&&el.tagName==="INPUT"){f.cult[+d.c][d.f]=el.value}
 else if(d.e!=null&&el.tagName==="INPUT"){f.elv[d.e][d.f]=el.value}
 else if(d.k&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&el.type!=="radio"&&el.type!=="checkbox"){a[d.k]=el.value}
 else return;
 persistDraft();
});
function listTarget(f,d){const it=f.cult[+d.c][d.l][+d.n];return d.j!=null?it.tr[+d.j]:it}
function listEdit(fn){if(!S.form)return;fn(S.form);persistDraft();const y=window.scrollY;renderForm();window.scrollTo(0,y)}
function findQ(id){for(const m of MODULES)for(const q of(m.qs||[]))if(q.id===id)return q}
window.addEventListener("online",()=>{renderTabs();sync();refresh(true)});
window.addEventListener("offline",()=>{renderTabs();if(S.view!=="form")render()});

/* ============================ DÉMARRAGE ============================ */
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(S.user){refresh(true).then(sync)}
})();
</script>
</body>
