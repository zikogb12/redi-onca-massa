<style>
/* Layout : application de terrain installable (PWA), une colonne lisible au téléphone ; barre supérieure fixe, un module par écran, tableau de bord en grilles pour le superviseur. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE7; --ink:#1C2521; --muted:#5A6660; --line:#D5DCD4;

  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --sunk:#202A26; --ink:#E3EAE6; --muted:#98A49E; --line:#2D3833;
  --accent:#4FB0BC; --accent-ink:#0B1A1C; --accent-soft:#16363A; --ochre:#D9A05B;
  --ok:#5DBB86; --ok-soft:#173826; --warn:#E0B04F; --warn-soft:#3A2E14; --bad:#E5806B; --bad-soft:#3E1F18; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#4FB0BC; --accent-ink:#0B1A1C; --accent-soft:#16363A; --ochre:#D9A05B;
  --ok:#5DBB86; --ok-soft:#173826; --warn:#E0B04F; --warn-soft:#3A2E14; --bad:#E5806B; --bad-soft:#3E1F18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:19px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.spacer{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 14px var(--f-body);cursor:pointer}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.net{font:500 11px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.net.on{background:var(--ok-soft);color:var(--ok)} .net.off{background:var(--warn-soft);color:var(--warn)}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:700} h3{font-size:16px;font-weight:700}
.eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font:600 15px var(--f-body);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font:600 12px var(--f-body);padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);background:var(--sunk)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.banner.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
.modnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.modnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--f-mono);border-radius:6px;padding:4px 8px;cursor:pointer}
.modnav button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.modnav button.err{border-color:var(--bad);color:var(--bad)}
.q{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q label.qt,.q .qt{font-weight:600}
.code{font:500 12px var(--f-mono);color:var(--accent);margin-right:6px}
.hint{font-size:13px;color:var(--muted)}
.err-msg{font-size:13px;color:var(--bad);font-weight:600}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.q.invalid input,.q.invalid select{border-color:var(--bad)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);cursor:pointer;min-height:44px;font-size:15px}
.chip input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip .k{font:500 12px var(--f-mono);color:var(--muted)}
.inline{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.inline label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.card+.card{margin-top:12px}
.card h3{display:flex;gap:8px;align-items:center}
.calc{font:500 13px var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 10px;color:var(--ink)}
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.footer-nav .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center}
.footer-nav .in .btn{flex:1}
/* tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.full{background:var(--ok)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 30px var(--f-display);font-stretch:85%}
.kpi span{font-size:13px;color:var(--muted)}
.list-item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.detail dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;margin:0}
.detail dt{color:var(--muted);font-size:13px}
.detail dd{margin:0;font-family:var(--f-mono);font-size:13px;word-break:break-word}
@media (max-width:520px){h1{font-size:24px}.detail dl{grid-template-columns:1fr}.detail dd{margin-bottom:6px}}
.gridq{display:grid;gap:8px}
.gridq label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;font-size:15px}
@media (max-width:520px){.gridq label{grid-template-columns:1fr;gap:4px}}
form.panel input{min-height:44px}
</style>
</head>

/* ============================ SERVEUR (Google Apps Script) ============================ */
async function api(action,p={},cred){
 if(!S.api)throw{code:"no_api"};
 const c=cred||S.user||{};
 const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),30000);
 let r;
 try{r=await fetch(S.api,{method:"POST",body:JSON.stringify(Object.assign({action,code:c.code,pin:c.pin},p)),signal:ctrl.signal,redirect:"follow"})}
 catch(e){throw{code:"reseau"}}finally{clearTimeout(t)}
 let j;try{j=await r.json()}catch(e){throw{code:"serveur"}}
 if(!j.ok)throw{code:j.err||"serveur",msg:j.msg};
 return j;
}
async function refresh(quiet){
 if(!S.user||!navigator.onLine||!S.api)return;
 S.loading=true;if(!quiet)render();
 try{
  const [e,m]=await Promise.all([api("echantillon"),api("mine")]);
  S.sample=e.rows;S.sampleAt=Date.now();LS.set("redi_sample",S.sample);LS.set("redi_sampleAt",S.sampleAt);
  S.mine=m.items;S.mineAt=Date.now();LS.set("redi_mine",S.mine);LS.set("redi_mineAt",S.mineAt);
  if(isSup()){const s=await api("summary");S.all=s.items}
  S.note="";
 }catch(err){if(err.code==="auth"){logout(true);return}S.note=ERR[err.code]||"Actualisation impossible."}
 S.loading=false;render();
}
let syncing=false;
async function sync(){
 if(syncing||!S.user||!S.outbox.length||!navigator.onLine||!S.api)return;syncing=true;
 const queue=[...S.outbox];let sent=0;
 for(const s of queue){
  try{const fl=flatten(s);await api("submit",{sub:s,row:fl.main,cult:fl.cult});S.outbox=S.outbox.filter(x=>x.id!==s.id);saveLocal();sent++}
  catch(e){S.note="Envoi interrompu : "+(ERR[e.code]||e.code)+" Les questionnaires restent sur ce téléphone.";break}
 }
 syncing=false;if(sent){toast(sent+" questionnaire(s) envoyé(s)");await refresh(true)}else render();
}

function kgFactor(c){return c.unit==="t"?1000:c.unit==="q"?100:c.unit==="caisse"?(num(c.kgc)||null):1}
function volume(a){
 if((a.C4c==="1"||a.C4c==="2")&&num(a.C4)!=null)return{v:num(a.C4),src:a.C4c==="1"?"compteur":"factures"};
 const c5=a.C5||{};if(a.C5c==="1"&&num(c5.debit)!=null&&num(c5.h)!=null&&num(c5.j)!=null)return{v:num(c5.debit)*num(c5.h)*num(c5.j),src:"débit × heures × jours"};
 if(a.C6!=null&&a.C6!=="NSP"&&num(a.C6)!=null)return{v:num(a.C6),src:"estimation exploitant"};
 if(a.C6==="NSP")return{v:null,src:"repère de secours (C6b) à estimer"};
 return{v:null,src:""};
}
function derive(f){
 const a=f.a,cs=f.cult||[],ot=f.autres||{};
 let valProd=0,okVal=true,charges=0,moSal=0;
 cs.forEach(c=>{const q=num(c.D5),p=num(c.D7);if(q!=null&&p!=null)valProd+=q*p;else okVal=false;
   ["E1","E2","E3","E7","E8"].forEach(k=>charges+=num(c[k])||0);moSal+=num(c.E5)||0});
 valProd+=num(ot.val)||0;charges+=(num(ot.E9)||0)-(num(ot.E10)||0);moSal+=num(ot.E10)||0;
 const vol=volume(a),va=valProd-((num(a.C7)||0)+charges);
 const supSerre=cs.filter(c=>c.D2==="1").reduce((s,c)=>s+(num(c.D3)||0),0),supPC=cs.filter(c=>c.D2==="2").reduce((s,c)=>s+(num(c.D3)||0),0);
 const mode=supSerre+supPC===0?"sans culture relevée":supSerre/(supSerre+supPC)>.5?"serre dominante":supPC/(supSerre+supPC)>.5?"plein champ dominant":"mixte";
 return{vol:vol.v,volSrc:vol.src,valProd:okVal?valProd:null,va:okVal?va:null,marge:okVal?va-moSal:null,prodEau:okVal&&vol.v?va/vol.v:null,
  consoHa:vol.v&&num(a.B3)?vol.v/num(a.B3):null,mode,F4:has(a.C8,"3")||has(a.C8,"4")?"1":"2",F8:a.C9==="1"?"1":"2",
  F12:(cs.some(c=>c.D8==="5")||a.H2==="1")?"1":"2"};
}

const cod=v=>typeof v==="string"&&/^\d{1,6}$/.test(v)?Number(v):(v??""); // codes de réponse en nombres
function flatten(s){
 const d=derive(s);
 const r={id_questionnaire:s.id,id_exploitation:s.a.idExpl,strate:cod(s.a.strate),classe:cod(s.a.classe),statut:s.status,enqueteur:s.a.codeEnq||"",debut:new Date(s.startedAt).toISOString(),fin:new Date(s.endedAt).toISOString(),duree_min:s.durMin,version:s.formVersion};
 MODULES.forEach(m=>(m.qs||[]).forEach(q=>{const x=s.a[q.id];
  if(q.id==="idExpl"||q.id==="strate"||q.id==="classe")return;
  if(q.t==="group")q.f.forEach(([k])=>r[`${q.id}_${k}`]=num((x||{})[k]));
  else if(q.t==="grid")q.rows.forEach(([k])=>r[`${q.id}_${k}`]=cod((x||{})[k]));
  else if(q.t==="multi"){r[q.id]=(x||[]).join(" ");const o=Array.isArray(q.o)?q.o:MODULES[3].qs[0].o;o.forEach(([c])=>r[`${q.id}_${c}`]=x?(x.includes(c)?1:0):null)}

function qVisible(q,f){return q.rel?!!q.rel(ctx(f)):true}
function opts(q,f){return typeof q.o==="function"?q.o(ctx(f)):q.o}

function checkQ(q,f){
 const a=f.a,v=a[q.id];if(!qVisible(q,f))return null;
 const req=q.req!==false&&q.t!=="note";
 if(q.t==="group"){const g=v||{};if(req&&q.f.some(x=>x[4]!==false&&emptyVal(g[x[0]])))return"Compléter tous les champs (0 si aucun).";
   for(const x of q.f){const n=num(g[x[0]]);if(!emptyVal(g[x[0]])&&(n==null||n<x[2]||n>x[3]))return`${x[1]} : valeur entre ${x[2]} et ${x[3]}.`;if(!q.dec&&n!=null&&!Number.isInteger(n))return`${x[1]} : nombre entier attendu.`}}
 else if(q.t==="grid"){const g=v||{};if(req&&q.rows.some(([k])=>emptyVal(g[k])))return"Répondre pour chaque ligne."}
 else if(q.t==="rank"){const r=v||[];if(req&&!r[0])return"Indiquer au moins le premier sujet.";if(new Set(r.filter(Boolean)).size!==r.filter(Boolean).length)return"Choisir des sujets différents."}
 else{ if(req&&emptyVal(v))return"Réponse obligatoire.";
   if(!emptyVal(v)&&(q.t==="int"||q.t==="dec")&&v!=="NSP"){const n=num(v);if(n==null)return"Nombre attendu.";if(q.t==="int"&&!Number.isInteger(n))return"Nombre entier attendu.";if(q.min!=null&&n<q.min||q.max!=null&&n>q.max)return`Valeur entre ${q.min} et ${q.max}.`}
   if(q.t==="tel"&&!emptyVal(v)&&!/^[0-9 +]{9,15}$/.test(v))return"Numéro de téléphone non valide.";
   if(q.t==="sample"&&!emptyVal(v)&&!/^[A-Za-z0-9-]{3,30}$/.test(v))return"Identifiant non valide (lettres, chiffres, tirets).";}

function checkCultures(f){

 if(f.nCult==null)e._n="Indiquer le nombre de cultures principales.";

   if(k==="D1p"&&c.D1!=="autre")return; if(k==="kgc"&&c.unit!=="caisse")return;

 sent.forEach(s=>{const v=s.validation;h+=`<div class="list-item"><div class="l"><b class="mono">${esc(s.idExpl)}</b><span class="muted">Strate ${esc(s.strate)} · ${esc(CLASSES[s.classe]||"")} · ${s.durMin!=null?s.durMin+" min":""}${s.status!=="complet"?" · "+esc(s.status):""}</span>${v&&v.statut==="rejete"&&v.motif?`<span class="err-msg">Motif : ${esc(v.motif)}</span>`:""}</div><div class="row">${s._pending?`<span class="pill warn">En attente</span>`:statusPill(s)}${v&&v.statut==="rejete"?`<button class="btn small" data-fix="${s.id}">Corriger</button>`:""}</div></div>`});
 h+=`</div>`;
 h+=`<details class="panel"><summary><b>Mode d'emploi</b></summary><ol class="hint"><li>Installez l'application : menu du navigateur → « Ajouter à l'écran d'accueil ». Elle s'ouvre ensuite sans réseau.</li><li>Le matin, avec du réseau, touchez « Actualiser » pour charger la liste tirée et les retours du superviseur.</li><li>Un brouillon est enregistré sur le téléphone à chaque réponse.</li><li>« Finaliser » contrôle tout le questionnaire, puis l'envoie dès qu'il y a du réseau. Sinon il reste « en attente » ; il partira automatiquement au retour du réseau.</li><li>Un questionnaire rejeté par le superviseur réapparaît avec le motif et un bouton « Corriger » (réseau nécessaire).</li><li>Ne videz pas les données du navigateur tant que des questionnaires sont « en attente ».</li></ol></details>`;
 h+=`<div class="row"><span class="spacer"></span><button class="btn small ghost" data-act="logout">Se déconnecter</button></div>`;
 app.innerHTML=h+`</div>`;
}

/* ============================ RENDU : SUPERVISEUR ============================ */
function okSub(s){return s.status==="complet"&&vstat(s)!=="rejete"}
function counts(subs){const c={};subs.filter(okSub).forEach(s=>{const k=s.strate+"-"+(s.strate==="IP"?"*":s.classe);c[k]=(c[k]||0)+1});return c}
function renderAdmin(){
 document.getElementById("footer").hidden=true;
 const subs=[...S.all].sort((x,y)=>(y.endedAt||0)-(x.endedAt||0)),c=counts(subs);
 const done=subs.filter(okSub).length,appr=subs.filter(s=>vstat(s)==="approuve").length,pend=subs.filter(s=>!vstat(s)||vstat(s)==="a_revalider").length;
 const durs=subs.filter(s=>s.durMin!=null&&s.status==="complet").map(s=>s.durMin).sort((a,b)=>a-b);
 const med=durs.length?durs[Math.floor(durs.length/2)]:null;
 let h=`<div class="stack"><div class="row"><div><div class="eyebrow">Superviseur · données du classeur Google</div><h1>Suivi de l'enquête</h1></div><span class="spacer"></span><button class="btn small" data-act="refresh" ${navigator.onLine?"":"disabled"}>${S.loading?"Actualisation…":"Actualiser"}</button></div>`;
 if(S.note)h+=`<div class="banner bad">${esc(S.note)}</div>`;
 h+=`<div class="tabs" role="tablist">${[["avancement","Avancement"],["questionnaires","Questionnaires"],["donnees","Données"]].map(([k,l])=>`<button class="tab" role="tab" aria-current="${S.adminTab===k}" data-atab="${k}">${l}</button>`).join("")}</div>`;
 if(S.adminTab==="avancement"){
  h+=`<div class="grid"><div class="panel kpi"><b class="mono">${done}<span class="muted" style="font-size:18px"> / ${QUOTA_TOTAL}</span></b><span>questionnaires complets</span></div><div class="panel kpi"><b class="mono">${appr}</b><span>approuvés</span></div><div class="panel kpi"><b class="mono">${pend}</b><span>à valider</span></div><div class="panel kpi"><b class="mono">${med!=null?med+" min":"—"}</b><span>durée médiane d'entretien</span></div></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Strate</th><th>Classe</th><th class="num">Réalisés</th><th class="num">Quota</th><th>Avancement</th></tr></thead><tbody>`;
  QUOTAS.forEach(q=>q.c.forEach((n,k)=>{const r=c[q.s+"-"+(k+1)]||0;h+=`<tr><td>${q.s} ${esc(q.n)}</td><td>${CLASSES[k+1]}</td><td class="num">${r}</td><td class="num">${n}</td><td><div class="bar"><i class="${r>=n?"full":""}" style="width:${Math.min(100,Math.round(100*r/n))}%"></i></div></td></tr>`}));
  const ip=Object.keys(c).filter(k=>k.startsWith("IP")).reduce((s,k)=>s+c[k],0);
  h+=`<tr><td>Irrigation privée</td><td>toutes</td><td class="num">${ip}</td><td class="num">${QUOTA_IP}</td><td><div class="bar"><i class="${ip>=QUOTA_IP?"full":""}" style="width:${Math.min(100,Math.round(100*ip/QUOTA_IP))}%"></i></div></td></tr></tbody></table></div>`;
  const byEnq={};subs.forEach(s=>{const k=s.enq||"?";byEnq[k]=byEnq[k]||{n:0,c:0,d:[],r:0};byEnq[k].n++;if(s.status==="complet")byEnq[k].c++;if(s.status==="refus")byEnq[k].r++;if(s.durMin!=null)byEnq[k].d.push(s.durMin)});
  h+=`<div class="panel"><h2>Par enquêteur</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Enquêteur</th><th class="num">Questionnaires</th><th class="num">Complets</th><th class="num">Refus</th><th class="num">Durée moyenne</th></tr></thead><tbody>${Object.entries(byEnq).map(([k,v])=>`<tr><td class="mono">${esc(k)}</td><td class="num">${v.n}</td><td class="num">${v.c}</td><td class="num">${v.r}</td><td class="num">${v.d.length?Math.round(v.d.reduce((a,b)=>a+b,0)/v.d.length)+" min":"—"}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Aucun questionnaire reçu pour l'instant.</td></tr>`}</tbody></table></div></div>`;
 }
 if(S.adminTab==="questionnaires"){
  const fl=S.filter;const list=subs.filter(s=>!fl||(fl==="avalider"&&(!vstat(s)||vstat(s)==="a_revalider"))||(fl==="court"&&s.durMin!=null&&s.durMin<20)||(fl==="rejete"&&vstat(s)==="rejete"));
  h+=`<div class="row">${[["","Tous"],["avalider","À valider"],["court","Moins de 20 min"],["rejete","Rejetés"]].map(([k,l])=>`<button class="tab" aria-current="${fl===k}" data-filter="${k}">${l}</button>`).join("")}</div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Identifiant</th><th>Strate</th><th>Enquêteur</th><th class="num">Durée</th><th>Statut</th><th></th></tr></thead><tbody>${list.map(s=>{const v=vstat(s);return`<tr><td class="mono">${esc(s.idExpl)}</td><td>${esc(s.strate)} · ${esc(CLASSES[s.classe]||"")}</td><td class="mono">${esc(s.enq)}</td><td class="num">${s.durMin!=null?s.durMin+" min":"—"}</td><td>${s.status!=="complet"?`<span class="pill">${esc(s.status)}</span>`:v==="approuve"?`<span class="pill ok">Approuvé</span>`:v==="rejete"?`<span class="pill bad">Rejeté</span>`:`<span class="pill warn">À valider</span>`}${s.durMin!=null&&s.durMin<20&&s.status==="complet"?` <span class="pill bad">court</span>`:""}</td><td><button class="btn small" data-detail="${s.id}">Ouvrir</button></td></tr>`}).join("")||`<tr><td colspan="6" class="muted">Aucun questionnaire dans ce filtre.</td></tr>`}</tbody></table></div>`;
  if(S.detail)h+=S.detailSub?renderDetail(S.detailSub,subs.find(x=>x.id===S.detail)):`<div class="panel" id="detail">Chargement du questionnaire…</div>`;
 }
 if(S.adminTab==="donnees"){
  h+=`<div class="panel stack"><h2>Où sont les données ?</h2><p>Tout arrive dans le classeur Google Sheets du projet : onglets <b>Exploitations</b> (une ligne par questionnaire, avec les indicateurs calculés), <b>Cultures</b> (une ligne par culture), <b>Validations</b> et <b>Brut</b> (sauvegarde intégrale). Pour un fichier Excel : dans le classeur, menu Fichier → Télécharger → Microsoft Excel.</p>
  ${CFG.SHEET_URL?`<div class="row"><a class="btn primary" href="${esc(CFG.SHEET_URL)}" target="_blank" rel="noopener">Ouvrir le classeur</a></div>`:""}
  <p class="hint">La liste tirée se colle directement dans l'onglet <b>Echantillon</b> (identifiant, strate, classe, nom, douar, téléphone) ; les comptes se gèrent dans l'onglet <b>Enqueteurs</b>. Les téléphones des exploitants restent dans le classeur : ils ne sont pas envoyés aux téléphones des enquêteurs.</p>
  <div class="row"><button class="btn" data-act="dict" ${navigator.onLine?"":"disabled"}>Écrire le dictionnaire des codes dans le classeur</button><span class="muted">${S.sample.length} exploitation(s) dans la liste tirée</span></div></div>`;
 }
 app.innerHTML=h+`</div>`;
}
function renderDetail(s,sum){
 const d=derive(s),v=sum&&sum.validation;
 const rows=[];MODULES.forEach(m=>{if(m.custom)return;(m.qs||[]).forEach(q=>{const x=s.a[q.id];if(emptyVal(x))return;rows.push([`${q.code||q.id} ${q.l}`,fmtAns(q,x)])})});
 return`<div class="panel detail stack" id="detail"><div class="row"><h2 class="mono">${esc(s.a.idExpl)}</h2><span class="spacer"></span><button class="btn small ghost" data-act="closedetail">Fermer</button></div>
 <div class="grid"><div class="kpi"><b class="mono" style="font-size:20px">${d.vol!=null?fmt(d.vol)+" m³":"—"}</b><span>volume d'eau (${esc(d.volSrc||"—")})</span></div><div class="kpi"><b class="mono" style="font-size:20px">${d.va!=null?fmt(d.va)+" DH":"—"}</b><span>valeur ajoutée</span></div><div class="kpi"><b class="mono" style="font-size:20px">${d.prodEau!=null?fmt(d.prodEau,2)+" DH/m³":"—"}</b><span>productivité de l'eau</span></div><div class="kpi"><b style="font-size:16px">${esc(d.mode)}</b><span>mode de production</span></div></div>
 <dl>${rows.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join("")}</dl>
 ${(s.cult||[]).map((c,i)=>`<div class="card"><h3>Culture ${i+1} · ${esc((CULTURES.find(x=>x[0]===c.D1)||[,""])[1])}</h3><dl>${CULT_FIELDS.filter(x=>!emptyVal(c[x[0]])).map(x=>`<dt>${esc(x[0]+" "+x[1])}</dt><dd>${esc(x[2]==="one"?((x[3].find(o=>o[0]===c[x[0]])||[,c[x[0]]])[1]):c[x[0]])}</dd>`).join("")}</dl></div>`).join("")}
 <div class="row"><input type="text" id="motif" placeholder="Motif en cas de rejet" style="flex:1;min-width:200px" value="${esc(v&&v.motif||"")}"><button class="btn primary" data-valid="approuve" data-id="${s.id}">Approuver</button><button class="btn danger" data-valid="rejete" data-id="${s.id}">Rejeter</button></div></div>`;
}
function fmtAns(q,x){
 if(q.t==="group")return q.f.map(([k,l])=>`${l} : ${x[k]??"—"}`).join(" · ");
 if(q.t==="grid")return q.rows.map(([k,l])=>`${l} : ${(q.o.find(o=>o[0]===x[k])||[,"—"])[1]}`).join(" · ");
 if(q.t==="rank")return(x||[]).filter(Boolean).map(c=>(q.o.find(o=>o[0]===c)||[,c])[1]).join(" > ");
 const o=Array.isArray(q.o)?q.o:null;
 if(q.t==="one"&&o)return(o.find(z=>z[0]===x)||[,x])[1];
 if(q.t==="multi"&&o)return x.map(c=>(o.find(z=>z[0]===c)||[,c])[1]).join(", ");
 return String(x);
}

/* ============================ NAVIGATION ============================ */
function renderTabs(){
 const t=document.getElementById("tabs");
 const items=[["home","Collecte"]];if(isSup())items.push(["admin","Superviseur"]);
 t.innerHTML=S.view==="form"||!S.user?"":items.map(([k,l])=>`<button class="tab" aria-current="${S.view===k}" data-view="${k}">${l}</button>`).join("");
 const n=document.getElementById("net");n.textContent=navigator.onLine?"en ligne":"hors ligne";n.className="net "+(navigator.onLine?"on":"off");
}
function render(){renderTabs();if(!S.user)renderLogin();else if(S.view==="form")renderForm();else if(S.view==="admin"&&isSup())renderAdmin();else renderHome()}

/* ============================ ACTIONS FORMULAIRE ============================ */
function newForm(pref){
 const codeEnq=S.user?S.user.code:"";
 S.form=pref||{id:uid(),a:{codeEnq},cult:[],nCult:null,hasAutres:null,autres:{},startedAt:Date.now(),updatedAt:Date.now()};
 S.mod=0;S.errors={};S.view="form";render();window.scrollTo(0,0);
}
function persistDraft(){if(!S.form)return;S.form.updatedAt=Date.now();S.drafts[S.form.id]=S.form;saveLocal()}
function applySample(id){const r=S.sample.find(x=>x.id===id);if(!r)return;const a=S.form.a;a.strate=r.cmv;a.classe=r.classe;if(r.douar&&!a.douar)a.douar=r.douar}
function goto(i){S.mod=i;S.errors={};render();window.scrollTo(0,0)}
function step(dir){
 const f=S.form,vm=visibleMods(f),pos=vm.indexOf(S.mod);
 if(dir>0){const e=modErrors(S.mod,f);if(Object.keys(e).length){S.errors=e;render();const el=document.querySelector(".invalid,.err-msg");if(el)el.scrollIntoView({block:"center"});toast("Corriger les réponses signalées");return}}
 if(dir>0&&stopped(f)&&S.mod===0){finish();return}
 const nx=vm[pos+dir];if(nx!=null)goto(nx);
}
function finish(){
 const f=S.form,vm=visibleMods(f);
 for(const i of vm){const e=modErrors(i,f);if(Object.keys(e).length){S.mod=i;S.errors=e;render();toast("Module "+MODULES[i].code+" incomplet");return}}
 const sub={id:f.id,a:f.a,cult:f.cult,nCult:f.nCult,hasAutres:f.hasAutres,autres:f.autres,startedAt:f.startedAt,endedAt:Date.now(),
  durMin:Math.round((Date.now()-f.startedAt)/60000),status:f.a.consent==="2"?"refus":f.a.active==="2"?"inactive":"complet",formVersion:FORM_VERSION};
 S.outbox=S.outbox.filter(x=>x.id!==sub.id);S.outbox.push(sub);delete S.drafts[f.id];saveLocal();
 S.form=null;S.view="home";toast("Questionnaire finalisé");render();sync();
}
function gps(){
 if(!navigator.geolocation){toast("Position indisponible sur ce téléphone");return}
 toast("Recherche de la position…");
 navigator.geolocation.getCurrentPosition(p=>{if(!S.form)return;S.form.a.gps={lat:p.coords.latitude.toFixed(6),lon:p.coords.longitude.toFixed(6),acc:String(Math.round(p.coords.accuracy))};persistDraft();renderForm();toast("Position relevée (± "+Math.round(p.coords.accuracy)+" m)")},
  e=>toast(e.code===1?"Autorisez la localisation pour cette application":"Position introuvable : réessayez à l'extérieur"),{enableHighAccuracy:true,timeout:25000,maximumAge:60000});
}

/* ============================ ÉVÉNEMENTS ============================ */
document.addEventListener("submit",async ev=>{
 if(ev.target.id!=="loginForm")return;ev.preventDefault();
 const code=document.getElementById("lg-code").value.trim(),pin=document.getElementById("lg-pin").value.trim();
 const apiEl=document.getElementById("lg-api");if(apiEl){S.api=apiEl.value.trim();LS.set("redi_api",S.api)}
 if(!S.api||!/^(https:\/\/|http:\/\/localhost)/.test(S.api)){S.note="Indiquer l'adresse du serveur (elle commence par https://).";render();return}
 if(!code||!pin){S.note="Indiquer le code et le PIN.";render();return}
 if(!navigator.onLine){S.note="La première connexion demande du réseau.";render();return}
 try{const j=await api("login",{},{code,pin});S.user={code:j.user.code,nom:j.user.nom,role:j.user.role,pin};LS.set("redi_user",S.user);S.note="";S.view="home";render();await refresh();sync()}
 catch(e){S.note=ERR[e.code]||"Connexion impossible.";render()}
});
document.addEventListener("click",async ev=>{
 const b=ev.target.closest("button");if(!b)return;
 const d=b.dataset;
 if(d.act==="login")return; // géré par submit
 if(d.view){S.view=d.view;S.detail=null;S.detailSub=null;render();if(d.view==="admin")refresh(true);return}
 if(d.go){if(+d.go>S.mod){for(const i of visibleMods(S.form)){if(i>=+d.go)break;const e=modErrors(i,S.form);if(Object.keys(e).length){goto(i);S.errors=e;render();toast("Module "+MODULES[i].code+" incomplet");return}}}goto(+d.go);return}
 if(d.resume){S.form=S.drafts[d.resume];S.mod=0;S.errors={};S.view="form";render();return}
 if(d.deldraft){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="Supprimer"}},3000);return}delete S.drafts[d.deldraft];saveLocal();render();return}
 if(d.fix){if(!navigator.onLine){toast("Réseau nécessaire pour ouvrir la correction");return}
  try{const j=await api("get",{id:d.fix});const s=j.sub;newForm({id:s.id,a:s.a,cult:s.cult||[],nCult:s.nCult,hasAutres:s.hasAutres,autres:s.autres||{},startedAt:s.startedAt,updatedAt:Date.now()})}catch(e){toast(ERR[e.code]||"Ouverture impossible")}return}
 if(d.atab){S.adminTab=d.atab;S.detail=null;S.detailSub=null;render();return}
 if(d.filter!=null&&b.classList.contains("tab")&&S.adminTab==="questionnaires"){S.filter=d.filter;render();return}
 if(d.detail){S.detail=d.detail;S.detailSub=null;render();try{const j=await api("get",{id:d.detail});if(S.detail===d.detail){S.detailSub=j.sub;render();const el=document.getElementById("detail");if(el)el.scrollIntoView()}}catch(e){toast(ERR[e.code]||"Ouverture impossible");S.detail=null;render()}return}
 if(d.valid){const motif=((document.getElementById("motif")||{}).value||"").trim();if(d.valid==="rejete"&&!motif){toast("Indiquer le motif du rejet");return}
  b.disabled=true;try{await api("validate",{id:d.id,statut:d.valid,motif});toast(d.valid==="approuve"?"Questionnaire approuvé":"Questionnaire rejeté");S.detail=null;S.detailSub=null;await refresh(true)}catch(e){b.disabled=false;toast(ERR[e.code]||"Validation non enregistrée")}return}
 switch(d.act){
  case"new":newForm();break;
  case"quit":persistDraft();S.form=null;S.view="home";render();break;
  case"next":step(1);break;case"prev":step(-1);break;case"finish":finish();break;
  case"sync":sync();break;
  case"refresh":refresh();break;
  case"gps":gps();break;
  case"closedetail":S.detail=null;S.detailSub=null;render();break;
  case"dict":b.disabled=true;try{await api("dict",{rows:dictRows()});toast("Dictionnaire écrit dans le classeur")}catch(e){toast(ERR[e.code]||"Écriture impossible")}b.disabled=false;break;
  case"logout":if(S.outbox.length){toast("Envoyez d'abord les questionnaires en attente");break}if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer la déconnexion";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="Se déconnecter"}},3000);break}logout();break;
 }
});
document.addEventListener("change",ev=>{
 const el=ev.target,d=el.dataset;if(!S.form)return;const f=S.form,a=f.a;
 if(d.t==="one"){a[d.k]=el.value}
 else if(d.t==="multi"){const q=findQ(d.k),cur=new Set(a[d.k]||[]);if(el.checked){if(q.ex&&q.ex.includes(el.value))cur.clear();else(q.ex||[]).forEach(x=>cur.delete(x));cur.add(el.value)}else cur.delete(el.value);a[d.k]=[...cur]}
 else if(d.grid!=null){a[d.k]=Object.assign({},a[d.k],{[d.grid]:el.value})}
 else if(d.rank!=null){a[d.k]=a[d.k]||[];a[d.k][+d.rank]=el.value}
 else if(d.nsp){a[d.nsp]=el.checked?"NSP":""}
 else if(d.ncult){const n=+el.value;f.nCult=n;f.cult=(f.cult||[]).slice(0,n);while(f.cult.length<n)f.cult.push({})}
 else if(d.autres){f.hasAutres=el.value;if(el.value==="2")f.autres={}}
 else if(d.c!=null&&el.tagName==="SELECT"){f.cult[+d.c][d.f]=el.value}
 else if((el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&(d.k||d.sub||d.c!=null||d.o)){persistDraft();if(sig()!==S._sig)setTimeout(()=>{const fid=document.activeElement&&document.activeElement.id;const y=window.scrollY;renderForm();window.scrollTo(0,y);if(fid){const n=document.getElementById(fid);if(n)n.focus({preventScroll:true})}},0);return}
 else return;
 if(d.k==="idExpl")applySample(el.value);
 persistDraft();const y=window.scrollY;renderForm();window.scrollTo(0,y);
});
document.addEventListener("input",ev=>{
 const el=ev.target,d=el.dataset;if(!S.form)return;const f=S.form,a=f.a;
 if(d.gps){const m=el.value.match(/(-?\d{1,2}\.\d+)[,\s/]+(-?\d{1,3}\.\d+)/);if(m){a.gps={lat:m[1],lon:m[2],acc:""};persistDraft();renderForm()}return}
 if(d.sub){a[d.k]=Object.assign({},a[d.k],{[d.sub]:el.value})}
 else if(d.c!=null&&el.tagName==="INPUT"){f.cult[+d.c][d.f]=el.value}
 else if(d.o){f.autres=Object.assign({},f.autres,{[d.o]:el.value})}
 else if(d.k&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&el.type!=="radio"&&el.type!=="checkbox"){a[d.k]=el.value;if(d.k==="idExpl"&&S.sample.some(r=>r.id===el.value)){applySample(el.value);persistDraft();renderForm();return}}
 else return;
 persistDraft();
});
function findQ(id){for(const m of MODULES)for(const q of(m.qs||[]))if(q.id===id)return q}
window.addEventListener("online",()=>{renderTabs();sync();refresh(true)});
window.addEventListener("offline",()=>{renderTabs();if(S.view!=="form")render()});

/* ============================ DÉMARRAGE ============================ */
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(S.user){refresh(true).then(sync)}
})();
</script>
